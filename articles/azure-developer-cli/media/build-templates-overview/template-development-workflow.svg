<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 390" role="img" aria-labelledby="title desc" style="max-width:900px;background-color:transparent">
  <title id="title">Azure Developer CLI template development workflow</title>
  <desc id="desc">Start with a new template or start from an existing template. Then explore and edit the files, optionally extend the template, run azd up, and maintain or share the template.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#505050"/>
    </marker>
    <style>
      .group { fill: #fff; stroke: #8a8886; stroke-width: 1.5; }
      .primary { fill: #e6f3ff; stroke: #0078d4; stroke-width: 2; }
      .action { fill: #fff; stroke: #505050; stroke-width: 1.75; }
      .line { fill: none; stroke: #505050; stroke-width: 1.75; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #505050; stroke-width: 1.75; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .label { fill: #171717; font: 17px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .group-label { fill: #171717; font: 17px "Segoe UI", Arial, sans-serif; font-weight: 600; text-anchor: middle; }
      .edge-label { fill: #505050; font: 15px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="group" x="20" y="20" width="300" height="350" rx="4"/>
  <text class="group-label" x="170" y="50">Choose a starting point</text>

  <rect class="primary" x="45" y="75" width="250" height="105" rx="4"/>
  <text class="label" x="170" y="124">
    <tspan x="170">Start with a new</tspan>
    <tspan x="170" dy="24">template</tspan>
  </text>

  <rect class="primary" x="45" y="235" width="250" height="80" rx="4"/>
  <text class="label" x="170" y="267">
    <tspan x="170">Start from an</tspan>
    <tspan x="170" dy="24">existing template</tspan>
  </text>

  <rect class="action" x="370" y="75" width="220" height="90" rx="4"/>
  <text class="label" x="480" y="111">
    <tspan x="480">Explore and edit</tspan>
    <tspan x="480" dy="24">the template files</tspan>
  </text>

  <rect class="action" x="370" y="245" width="220" height="70" rx="4"/>
  <text class="label" x="480" y="286">Extend the template</text>

  <rect class="action" x="665" y="75" width="170" height="90" rx="4"/>
  <text class="label" x="750" y="126">Run azd up</text>

  <rect class="action" x="655" y="245" width="190" height="70" rx="4"/>
  <text class="label" x="750" y="274">
    <tspan x="750">Maintain or share</tspan>
    <tspan x="750" dy="24">the template</tspan>
  </text>

  <path class="line" d="M295 128 C330 128, 335 110, 370 110"/>
  <path class="line" d="M295 275 C330 275, 335 145, 370 145"/>
  <path class="line" d="M590 120 L665 120"/>
  <path class="optional" d="M480 165 L480 245"/>
  <text class="edge-label" x="520" y="211">Optional</text>
  <path class="line" d="M590 280 C630 280, 625 155, 665 145"/>
  <path class="line" d="M750 165 L750 245"/>
</svg>
