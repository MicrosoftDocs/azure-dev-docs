[workspace]
resolver = "2"
members = ["authentication"]

[workspace.dependencies]
azure_core = "0.35"
azure_identity = "0.35"
azure_security_keyvault_secrets = "0.14"
tokio = { version = "1", features = ["full"] }

[workspace.lints.rust]
unused_variables = "allow"

[workspace.lints.clippy]
needless_borrow = "allow"
